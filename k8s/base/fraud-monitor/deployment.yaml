apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-monitor
  namespace: payments
  labels:
    app: fraud-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-monitor
  template:
    metadata:
      labels:
        app: fraud-monitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: fraud-monitor
          image: ghcr.io/rangumallikarjun/fraud-monitor:initial
          ports:
            - containerPort: 8000
          env:
            - name: FAILURE_RATE
              value: "0.02"
            - name: FLAG_RATE
              value: "0.05"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
