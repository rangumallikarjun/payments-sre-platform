services:
  payment-service:
    build: ./src/payment-service
    ports:
      - "8001:8000"
    environment:
      - FAILURE_RATE=0.03

  fraud-monitor:
    build: ./src/fraud-monitor
    ports:
      - "8002:8000"
    environment:
      - FAILURE_RATE=0.02
      - FLAG_RATE=0.05

  notification-service:
    build: ./src/notification-service
    ports:
      - "8003:8000"
    environment:
      - FAILURE_RATE=0.04

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - payment-service
      - fraud-monitor
      - notification-service

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
